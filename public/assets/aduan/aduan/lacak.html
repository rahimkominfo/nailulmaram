<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacak Aduan — Masjid Jami Nailul Maram</title>
    <meta name="description" content="Lacak status aduan Anda menggunakan kode tiket yang diberikan saat pengiriman aduan.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:{50:'#ECFDF5',100:'#D1FAE5',500:'#10B981',700:'#047857',900:'#064E3B'}, gold:{100:'#FDF6E3',500:'#D4A843'} },
        fontFamily: { heading:['"Plus Jakarta Sans"','sans-serif'], body:['Inter','sans-serif'], mono:['"JetBrains Mono"','monospace'] }
      }}
    }
    </script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="font-body bg-gray-50 text-gray-800 antialiased">

    <!-- BREADCRUMB -->
    <div class="bg-white border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <nav class="flex items-center gap-2 text-sm text-gray-500">
                <a href="../index.html" class="hover:text-primary-700 transition"><i class="fas fa-home text-xs"></i></a>
                <i class="fas fa-chevron-right text-[0.6rem] text-gray-300"></i>
                <span class="text-gray-800 font-medium">Lacak Aduan</span>
            </nav>
        </div>
    </div>

    <!-- TRACKING FORM -->
    <section class="min-h-[65vh] flex items-center justify-center py-16">
        <div class="max-w-lg mx-auto px-4 w-full">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary-50 rounded-2xl flex items-center justify-center mx-auto mb-5">
                    <i class="fas fa-magnifying-glass text-2xl text-primary-700"></i>
                </div>
                <h1 class="font-heading text-2xl md:text-3xl font-bold text-gray-900 mb-2">Lacak Status Aduan</h1>
                <p class="text-gray-500 text-sm md:text-base">Masukkan kode tiket yang Anda terima saat mengirimkan aduan.</p>
            </div>

            <div class="card-static p-6 md:p-8">
                <form onsubmit="handleLacakAduan(event)">
                    <div class="form-group mb-2">
                        <label class="form-label">Kode Tiket <span class="required">*</span></label>
                        <div class="flex gap-3">
                            <input type="text" class="form-input font-mono tracking-wider" placeholder="ADU-XXXXXXXX-XXX" style="font-family:'JetBrains Mono',monospace" required>
                            <button type="submit" class="btn btn-primary whitespace-nowrap">
                                <i class="fas fa-search"></i> Lacak
                            </button>
                        </div>
                        <p class="form-hint mt-2">Contoh format: ADU-20260506-001</p>
                    </div>
                </form>
            </div>

            <!-- Help Card -->
            <div class="mt-6 p-4 bg-blue-50 border border-blue-100 rounded-xl">
                <div class="flex items-start gap-3">
                    <i class="fas fa-circle-info text-blue-500 mt-0.5"></i>
                    <div class="text-sm text-blue-700">
                        <p class="font-semibold mb-1">Tidak punya kode tiket?</p>
                        <p>Kode tiket diberikan setelah Anda mengirimkan aduan. Jika Anda belum mengirimkan aduan, <a href="buat.html" class="font-semibold underline hover:no-underline">klik di sini</a> untuk membuatnya.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/app.js"></script>
</body>
</html>
